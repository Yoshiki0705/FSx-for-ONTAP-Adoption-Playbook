# Scoped exception only. The reusable ONTAP-ops Lambda lives at automation/ontap-ops/,
# whose hyphen is required by its path in the Hub tree (matching the sibling
# automation/fsxn-ops reference) but makes it an invalid Python module name, so ruff's
# N999 fires on every __init__.py there. The package is loaded by path (see the tests'
# _bootstrap.py), never imported as automation.ontap-ops, so the invalid name is inert.
# Nothing else about the default rule set is changed.
[lint.per-file-ignores]
"automation/ontap-ops/**/__init__.py" = ["N999"]
"automation/ontap-ops/__init__.py" = ["N999"]

# Byte-for-byte copies of the supply-chain core from another repository. They are verified
# against docs/agent/supply-chain-source.json by tools/check_supply_chain_copy.py, so they
# cannot be edited to satisfy this repository's rule set; the rules they trip are listed here
# by number and nothing wider is excluded.
"tools/supply_chain/planner.py" = ["I001", "SIM114"]
"tools/supply_chain/run_record.py" = ["RUF100"]
"tools/supply_chain/vex.py" = ["RUF100"]

# The copies were formatted with a different line length. Formatting them here would change
# their bytes, so they are excluded from `ruff format` only; `ruff check` still reads them.
[format]
exclude = ["tools/supply_chain/*.py", "tools/supply_chain_adapters/*.py"]
