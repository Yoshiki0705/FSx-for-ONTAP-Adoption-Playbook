name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/**'
  schedule:
    # Weekly, so a finding that a newer zizmor release would report on an unchanged workflow
    # still surfaces.
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  zizmor:
    name: workflow security lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Exact pin: a range would make the verdict depend on the day the job runs.
      - name: Install zizmor
        run: python -m pip install zizmor==1.32.0

      # Default severity and confidence thresholds. Any finding fails the job.
      # Without GH_TOKEN zizmor skips the audits that call the GitHub API.
      - name: Run zizmor
        run: zizmor .github/workflows/
