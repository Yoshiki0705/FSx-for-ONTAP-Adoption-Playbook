name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a secret committed before the rule that would catch it still gets found.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
