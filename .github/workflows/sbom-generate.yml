# Reusable workflow: generate an SBOM and a normalized scan result for the calling repository.
#
# Called by the Spokes (not by this repository), on pushes to the default branch. It is layer B of the
# supply-chain design: a scanner run in the Spoke's own CI. The Aggregator reads the artifact later.
#
# What it produces, as the artifact `sbom-<commit-sha>` (kept `retention-days` days, at most 90, the
# public-repository ceiling):
#   sbom.spdx.json            SPDX 2.3, with the commit SHA, the creation time (UTC, seconds) and the tool
#   findings.normalized.json  the scan of that SBOM, in the shape tools/supply_chain/normalized.py reads
#   generation.json           purls, directness, author, format name and version, generation stage
#   image-sboms/*.spdx.json   one per container image, when `image-ref` is given
#   lambda-inventory.json     Lambda functions found in CloudFormation / SAM / CDK templates, when any exist
# A commit with no components still gets an SBOM: `generation.json` says `component_count: 0` and the
# SPDX document says `CONTAINS NONE`.
#
# What it does NOT do, on purpose:
#   * It does not attach the SBOM to the container image, attach it to a release, or attest it. The
#     release workflow of each repository does that (an SBOM of the commit that made the release as a
#     release asset, and `actions/attest` provenance with a `*.sigstore.json` bundle for it). This workflow
#     holds neither the OIDC-token permission nor the attestation permission, and writes nothing.
#   * It does not fetch layer A (the GitHub dependency-graph export and Dependabot alerts). The
#     Aggregator reads those; a failure to obtain them is recorded in the Aggregator's run record.
#   * It does not pass `.vex/` to the scanner (`--vex`, `TRIVY_VEX`). Only the Aggregator reads `.vex/`.
#
# Scanner series. Generation and scanning use the same series, so one distribution's mistakes are not
# split across two tools: `trivy` (Trivy generates and scans) or `syft-grype` (Syft generates, Grype
# scans). SCANNER_SERIES below is a provisional default and not a verdict on either series; it is to be
# decided after a pilot measures what each misses. The vulnerability databases both scanners download
# when they run are not pinned by this workflow.
#
# Fails, and saves no artifact, when the input check, the SBOM generation, the scan or `docker save`
# fails. No secrets, no write permission, no inherited secrets.
name: sbom-generate

on:
  workflow_call:
    inputs:
      image-build-command:
        description: Shell command that builds the container image. Empty means the repository has no image
        type: string
        required: false
        default: ''
      image-ref:
        description: Reference of the image the command builds, for `docker save`
        type: string
        required: false
        default: ''
      retention-days:
        description: Days to keep the artifact (1 to 90)
        type: number
        required: false
        default: 90
    outputs:
      sbom-artifact-name:
        description: Name of the uploaded artifact, sbom-<commit-sha>
        value: ${{ jobs.generate.outputs.sbom-artifact-name }}

permissions: {}

env:
  # `trivy` or `syft-grype`. Provisional (see above).
  SCANNER_SERIES: trivy
  # Each tool: the release version and the SHA-256 of the Linux amd64 archive. The three values agree
  # between the archive downloaded, the release's checksums.txt, and the digest GitHub shows for the asset.
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
  SYFT_VERSION: "1.57.1"
  SYFT_SHA256: bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c
  GRYPE_VERSION: "0.121.3"
  GRYPE_SHA256: e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85
  PYYAML_VERSION: "6.0.3"

jobs:
  generate:
    name: generate SBOM and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sbom-artifact-name: ${{ steps.name.outputs.artifact }}
    steps:
      - name: Check inputs
        env:
          IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
          IMAGE_REF: ${{ inputs.image-ref }}
          RETENTION_DAYS: ${{ inputs.retention-days }}
        run: |
          case "$RETENTION_DAYS" in
            ''|*[!0-9]*)
              echo "::error::retention-days must be a whole number from 1 to 90"
              exit 1
              ;;
          esac
          if [ "$RETENTION_DAYS" -lt 1 ] || [ "$RETENTION_DAYS" -gt 90 ]; then
            echo "::error::retention-days must be from 1 to 90 (the public-repository ceiling)"
            exit 1
          fi
          if [ -n "$IMAGE_BUILD_COMMAND" ] && [ -z "$IMAGE_REF" ]; then
            echo "::error::image-ref is required when image-build-command is given"
            exit 1
          fi
          if [ -n "$IMAGE_REF" ] && ! [[ "$IMAGE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/:@-]*$ ]]; then
            echo "::error::image-ref contains characters an image reference does not use"
            exit 1
          fi
          case "$SCANNER_SERIES" in
            trivy|syft-grype) ;;
            *)
              echo "::error::SCANNER_SERIES must be trivy or syft-grype"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"

      - name: Write the helper script
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/out/image-sboms" "$RUNNER_TEMP/raw"
          cat > "$RUNNER_TEMP/sc.py" <<'PY'
          """Helper for the sbom-generate workflow. Standard library, plus PyYAML for CloudFormation YAML.

              sc.py stamp <sbom.spdx.json>                       add the commit SHA, check created / tool / commit
              sc.py findings trivy|grype <raw.json> <out.json> <tool-name> <tool-version> [<more raw.json> ...]
              sc.py inventory <root> <out.json>                  Lambda functions in CloudFormation / SAM / CDK templates
              sc.py generation <sbom.spdx.json> <out.json> <series> <image-count>
          """

          import glob
          import json
          import os
          import re
          import sys
          from datetime import UTC, datetime

          SHA = re.compile(r"[0-9a-f]{40}")
          SEVERITIES = {"CRITICAL", "HIGH", "MEDIUM", "LOW"}


          def now_text():
              return datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ")


          def purl_of(package):
              for ref in package.get("externalRefs", []):
                  if ref.get("referenceType") == "purl":
                      return ref.get("referenceLocator")
              return None


          def stamp(path):
              commit = os.environ["COMMIT_SHA"]
              if not SHA.fullmatch(commit):
                  sys.exit("COMMIT_SHA is not 40 lowercase hex digits")
              doc = json.load(open(path, encoding="utf-8"))
              if doc.get("spdxVersion") != "SPDX-2.3":
                  sys.exit(f"spdxVersion is {doc.get('spdxVersion')!r}, expected SPDX-2.3")
              info = doc.setdefault("creationInfo", {})
              info["comment"] = f"commit: {commit}"
              tools = [c for c in info.get("creators", []) if c.startswith("Tool: ")]
              if not info.get("created") or not tools:
                  sys.exit("SBOM has no created time or no Tool creator")
              describes = [r["relatedSpdxElement"] for r in doc.get("relationships", []) if r.get("relationshipType") == "DESCRIBES"]
              components = [p for p in doc.get("packages", []) if purl_of(p)]
              if not components and describes:
                  # SPDX 2.3, 11.1: an explicit statement that the subject contains nothing.
                  doc.setdefault("relationships", []).append(
                      {"spdxElementId": describes[0], "relationshipType": "CONTAINS", "relatedSpdxElement": "NONE"}
                  )
              json.dump(doc, open(path, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
              print(f"stamped {path}: {len(components)} component(s)")


          def time_text(raw):
              if not raw:
                  return None
              try:
                  return datetime.fromisoformat(raw.replace("Z", "+00:00")).astimezone(UTC).strftime("%Y-%m-%dT%H:%M:%SZ")
              except ValueError:
                  return None


          def severity(raw):
              level = (raw or "").upper()
              return level if level in SEVERITIES else None  # UNKNOWN, Negligible and anything else are not scored


          def trivy_findings(doc):
              out = []
              for result in doc.get("Results") or []:
                  for v in result.get("Vulnerabilities") or []:
                      purl = (v.get("PkgIdentifier") or {}).get("PURL") or f"pkg:generic/{v.get('PkgName')}@{v.get('InstalledVersion')}"
                      vuln_id = v["VulnerabilityID"]
                      out.append(
                          {
                              "vuln_id": vuln_id,
                              "aliases": [a for a in v.get("VendorIDs") or [] if a != vuln_id],
                              "purl": purl,
                              "cvss_severity": None if vuln_id.startswith("MAL-") else severity(v.get("Severity")),
                              "fixed_version": v.get("FixedVersion") or None,
                              "advisory_published_at": time_text(v.get("PublishedDate")),
                          }
                      )
              return out


          def grype_findings(doc):
              out = []
              for m in doc.get("matches") or []:
                  v = m["vulnerability"]
                  ids = [v["id"]] + [r["id"] for r in m.get("relatedVulnerabilities") or []]
                  representative = next((i for i in ids if i.startswith("CVE-")), ids[0])
                  versions = (v.get("fix") or {}).get("versions") or []
                  out.append(
                      {
                          "vuln_id": representative,
                          "aliases": [i for i in ids if i != representative],
                          "purl": m["artifact"].get("purl") or f"pkg:generic/{m['artifact']['name']}@{m['artifact']['version']}",
                          "cvss_severity": None if representative.startswith("MAL-") else severity(v.get("severity")),
                          "fixed_version": versions[0] if versions else None,
                          "advisory_published_at": None,
                      }
                  )
              return out


          def findings(kind, out_path, tool_name, tool_version, raw_paths):
              convert = trivy_findings if kind == "trivy" else grype_findings
              items = []
              for raw in raw_paths:
                  items.extend(convert(json.load(open(raw, encoding="utf-8"))))
              doc = {
                  "schema_version": 1,
                  "repo": os.environ["REPO"],
                  "commit": os.environ["COMMIT_SHA"],
                  "layer": "B",
                  "generated_at": now_text(),
                  "tool": {"name": tool_name, "version": tool_version},
                  "findings": items,
              }
              json.dump(doc, open(out_path, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
              print(f"{out_path}: {len(items)} finding(s)")


          def load_template(path, yaml):
              text = open(path, encoding="utf-8").read()
              if path.endswith(".json"):
                  return json.loads(text)

              class Loader(yaml.SafeLoader):
                  pass

              Loader.add_multi_constructor("!", lambda loader, suffix, node: None)
              return yaml.load(text, Loader=Loader)


          def inventory(root, out_path):
              import yaml  # an ImportError here is a broken install and must fail the step, not read as "no templates"

              skip = ("/node_modules/", "/.git/")
              paths = sorted(
                  p
                  for pattern in ("**/*.template.json", "**/cdk.out/*.json", "**/*.yaml", "**/*.yml")
                  for p in glob.glob(os.path.join(root, pattern), recursive=True)
                  if not any(s in p for s in skip) and os.path.getsize(p) <= 2_000_000
              )
              functions, templates = [], 0
              for path in sorted(set(paths)):
                  try:
                      doc = load_template(path, yaml)
                  except (ValueError, yaml.YAMLError, OSError):  # not a template, or not readable as one
                      continue
                  if not isinstance(doc, dict) or not isinstance(doc.get("Resources"), dict):
                      continue
                  if "AWSTemplateFormatVersion" not in doc and "Transform" not in doc and "cdk.out" not in path:
                      continue
                  templates += 1
                  for logical_id, res in doc["Resources"].items():
                      if not isinstance(res, dict) or res.get("Type") not in ("AWS::Lambda::Function", "AWS::Serverless::Function"):
                          continue
                      props = res.get("Properties") or {}
                      functions.append(
                          {
                              "template": os.path.relpath(path, root),
                              "logical_id": logical_id,
                              "type": res["Type"],
                              "runtime": props.get("Runtime") if isinstance(props.get("Runtime"), str) else "unknown",
                              "architectures": props.get("Architectures") if isinstance(props.get("Architectures"), list) else "unknown",
                              "package_type": props.get("PackageType") if isinstance(props.get("PackageType"), str) else "unknown",
                              "layer_count": len(props["Layers"]) if isinstance(props.get("Layers"), list) else 0,
                          }
                      )
              if templates == 0:
                  print("no CloudFormation, SAM or CDK template found; lambda-inventory.json not written")
                  return
              json.dump(
                  {"schema_version": 1, "generated_at": now_text(), "templates": templates, "functions": functions},
                  open(out_path, "w", encoding="utf-8"),
                  indent=2,
              )
              print(f"{out_path}: {templates} template(s), {len(functions)} function(s)")


          def generation(sbom_path, out_path, series, image_count):
              doc = json.load(open(sbom_path, encoding="utf-8"))
              packages = [p for p in doc.get("packages", []) if purl_of(p)]
              info = doc["creationInfo"]
              tool = next(c for c in info["creators"] if c.startswith("Tool: ")).removeprefix("Tool: ")
              describes = {r["relatedSpdxElement"] for r in doc.get("relationships", []) if r.get("relationshipType") == "DESCRIBES"}
              direct = {r["relatedSpdxElement"] for r in doc.get("relationships", []) if r.get("spdxElementId") in describes and r.get("relationshipType") in ("CONTAINS", "DEPENDS_ON")}
              out = {
                  "schema_version": 1,
                  "generated_at": info["created"],
                  "commit": os.environ["COMMIT_SHA"],
                  "component_count": len(packages),
                  "tool": tool,
                  "scanner_series": series,
                  "format": {"name": "SPDX", "version": doc["spdxVersion"].removeprefix("SPDX-")},
                  "generation_stage": "source",
                  "author": "unknown",
                  "creators": info["creators"],
                  "directness": {p["SPDXID"]: ("direct" if p["SPDXID"] in direct else "unknown") for p in packages},
                  "purls": sorted(purl_of(p) for p in packages),
                  "image_sbom_count": int(image_count),
              }
              json.dump(out, open(out_path, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
              print(f"{out_path}: component_count={out['component_count']}")


          if __name__ == "__main__":
              command, args = sys.argv[1], sys.argv[2:]
              if command == "stamp":
                  stamp(*args)
              elif command == "findings":
                  findings(args[0], args[2], args[3], args[4], [args[1], *args[5:]])
              elif command == "inventory":
                  inventory(*args)
              elif command == "generation":
                  generation(*args)
              else:
                  sys.exit(f"unknown command {command}")
          PY

      - name: Install Trivy
        if: ${{ env.SCANNER_SERIES == 'trivy' }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Syft and Grype
        if: ${{ env.SCANNER_SERIES == 'syft-grype' }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/bin" grype
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build and save the container image
        if: ${{ inputs.image-ref != '' }}
        env:
          IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          if [ -n "$IMAGE_BUILD_COMMAND" ]; then
            bash -euo pipefail -c "$IMAGE_BUILD_COMMAND"
          fi
          docker save "$IMAGE_REF" --output "$RUNNER_TEMP/image.tar"

      - name: Generate the SBOM and scan it
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          HAS_IMAGE: ${{ inputs.image-ref != '' }}
        run: |
          out="$RUNNER_TEMP/out"
          raw="$RUNNER_TEMP/raw"
          sc="$RUNNER_TEMP/sc.py"
          if [ "$SCANNER_SERIES" = "trivy" ]; then
            # SPDX 2.3 is Trivy's JSON SPDX output. --exit-code 0 is explicit: a finding is not a failure
            # of this workflow, it is the data; an error of the scan itself still fails the step.
            trivy fs --quiet --format spdx-json --output "$out/sbom.spdx.json" .
            python3 "$sc" stamp "$out/sbom.spdx.json"
            trivy sbom --quiet --format json --exit-code 0 --output "$raw/source.json" "$out/sbom.spdx.json"
            raws=("$raw/source.json")
            if [ "$HAS_IMAGE" = "true" ]; then
              trivy image --quiet --input "$RUNNER_TEMP/image.tar" --format spdx-json --output "$out/image-sboms/image.spdx.json"
              python3 "$sc" stamp "$out/image-sboms/image.spdx.json"
              trivy sbom --quiet --format json --exit-code 0 --output "$raw/image.json" "$out/image-sboms/image.spdx.json"
              raws+=("$raw/image.json")
            fi
            python3 "$sc" findings trivy "${raws[0]}" "$out/findings.normalized.json" trivy "$TRIVY_VERSION" "${raws[@]:1}"
          else
            # spdx-json@2.3 names the version: Syft's default `spdx-json` is SPDX 3.0, which the reader refuses.
            syft dir:. --quiet --output "spdx-json@2.3=$out/sbom.spdx.json"
            python3 "$sc" stamp "$out/sbom.spdx.json"
            grype "sbom:$out/sbom.spdx.json" --quiet --output json --file "$raw/source.json"
            raws=("$raw/source.json")
            if [ "$HAS_IMAGE" = "true" ]; then
              syft "docker-archive:$RUNNER_TEMP/image.tar" --quiet --output "spdx-json@2.3=$out/image-sboms/image.spdx.json"
              python3 "$sc" stamp "$out/image-sboms/image.spdx.json"
              grype "sbom:$out/image-sboms/image.spdx.json" --quiet --output json --file "$raw/image.json"
              raws+=("$raw/image.json")
            fi
            python3 "$sc" findings grype "${raws[0]}" "$out/findings.normalized.json" syft+grype "${SYFT_VERSION}+${GRYPE_VERSION}" "${raws[@]:1}"
          fi
          python3 "$sc" generation "$out/sbom.spdx.json" "$out/generation.json" "$SCANNER_SERIES" "$(find "$out/image-sboms" -name '*.spdx.json' | wc -l | tr -d ' ')"
          python3 "$sc" inventory . "$out/lambda-inventory.json"
          {
            echo "### sbom-generate"
            echo
            echo "- scanner series: $SCANNER_SERIES"
            echo "- components: $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["component_count"])' "$out/generation.json")"
            echo "- findings: $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["findings"]))' "$out/findings.normalized.json")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the artifact
        id: name
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "artifact=sbom-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload the SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
