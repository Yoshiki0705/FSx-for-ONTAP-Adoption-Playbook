name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: docs quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Installed from the pinned manifest, not `pipx install ruff`. An unpinned install
      # resolves to the latest release, so a ruff version that widens its default rule set
      # turns this gate red without any commit — and disagrees with whatever developers
      # have locally. requirements-dev.txt is the single declared version.
      - name: Install ruff
        run: pip install -r requirements-dev.txt

      # check and format are separate steps because formatting drift otherwise passes locally
      # and only surfaces in CI, which is exactly the failure this ordering prevents.
      - name: Lint Python tooling
        run: ruff check tools scripts

      - name: Check Python formatting
        run: ruff format --check tools scripts

      # Each validator runs as its own step so a failure names the concern that broke,
      # rather than reporting "make all failed".
      - name: Validate frontmatter
        run: python3 tools/validate_frontmatter.py --stats

      - name: Check i18n parity
        run: python3 tools/check_i18n_parity.py

      - name: Check language switchers and cross-language links
        run: python3 tools/sync_lang_switcher.py

      - name: Audit public output
        run: python3 tools/audit_public_output.py

      - name: Check internal links
        run: python3 tools/check_links.py

      - name: Check agent context budget
        run: python3 scripts/check_agent_context_budget.py

  markdown-lint:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules
