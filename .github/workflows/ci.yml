name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: docs quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Installed from the pinned manifest, not `pipx install ruff`. An unpinned install
      # resolves to the latest release, so a ruff version that widens its default rule set
      # turns this gate red without any commit — and disagrees with whatever developers
      # have locally. requirements-dev.txt is the single declared version.
      - name: Install ruff and cfn-lint
        run: pip install -r requirements-dev.txt

      # shellcheck is not pip-installable, so it cannot live in requirements-dev.txt with the
      # others. ubuntu-latest ships it preinstalled; this step fails loudly if that ever stops
      # being true, rather than letting `make shell` report a missing tool as a red gate with a
      # confusing message.
      - name: Check shellcheck is available
        run: shellcheck --version

      # Every step below calls a Makefile target instead of repeating the command. The
      # path list lives once, in the Makefile's PY_PATHS, so CI and a developer's machine
      # cannot end up inspecting different trees -- a divergence that surfaces as "it
      # passed locally" and costs a round trip to find. `make python` also fails when the
      # ruff on PATH is not the pinned version, rather than warning and continuing.
      #
      # One target per step, so a failure names the concern that broke rather than
      # reporting "make all failed".
      - name: Lint and format-check Python tooling
        run: make python

      - name: Validate frontmatter
        run: make frontmatter

      # The other half of `make lint` that is not markdownlint. AGENTS.md states the noun-phrase
      # rule for Japanese section headings as a convention, and until now nothing enforced it on a
      # pull request -- the target existed and ran only when someone typed `make all`.
      - name: Check Japanese heading style
        run: make headings

      # examples/ ships a template and scripts that readers run against their own accounts. A
      # quoting bug or an invalid property there is a defect delivered, not a lint finding, and
      # a template that only fails at CreateStack time costs the reader a twenty-minute file
      # system creation to discover.
      - name: Lint shell scripts
        run: make shell

      - name: Lint CloudFormation templates
        run: make cfn

      - name: Check i18n parity
        run: make i18n-check

      - name: Check language switchers and cross-language links
        run: make switcher-check

      # An English page linking into Japanese-only prose has to say so. Without the marker the
      # reader follows the link and finds a language they may not read, which is a defect delivered
      # to the reader rather than a lint finding.
      - name: Check Japanese-only link markers
        run: make ja-markers

      - name: Audit public output
        run: make audit
      # After the audit, deliberately. The audit reads content; this reads how much of the audit has
      # been switched off, and a finding about the guard should not delay a finding about the text.
      - name: Check the allow-marker budget has not grown
        run: make allow-budget

      - name: Check internal links
        run: make links

      # Offline half only. The network half (cross-repo-external) is opt-in for the same reason
      # links-external is: a sibling repository being briefly unreachable is not a defect in this
      # change, and a gate that fails for that reason gets ignored.
      - name: Check cross-repository citations are registered
        run: make cross-repo

      # Renaming a heading another repository cites by fragment is invisible from the other side:
      # GitHub answers an unknown fragment with the top of the page, so the citing document keeps
      # resolving and stops pointing at anything. This gate is the only place that break surfaces,
      # and it was running only by hand.
      - name: Check externally cited anchors are unchanged
        run: make anchors

      # .kiro/ is gitignored, so the steering-loader half of this check cannot run here.
      # The target reports that on stdout rather than skipping silently and printing
      # "healthy", which is what it used to do.
      # Both read the committed .drawio and .svg only, so neither needs the AWS icon
      # package or the draw.io CLI. They were in `make all` but not here, which meant a
      # pull request could go green on a figure a reader cannot read.
      - name: Check diagram label size
        run: make diagram-fonts
      - name: Check diagram reading direction
        run: make diagram-flow
      - name: Check agent context budget
        run: make drift

      # A workflow no pull request runs cannot be observed failing, so it has to be declared. The
      # guard for that was itself running only from `make all` and the hook -- which is to say, only
      # where someone had already chosen to look.
      - name: Check workflow observability
        run: make workflow-observability

      # Guardrail tests: the irreversibility guard's block / ask / allow contract, .PHONY
      # completeness, and one deliberate break per documentation gate. Without these a
      # gate can stop detecting anything and still report success.
      - name: Run guardrail and gate tests
        # Four of these reach the GitHub API and skip with the reason named when it will not
        # answer. Skipping is right -- a sibling being briefly unreachable is not a defect in this
        # change. Skipping *routinely* is not: unauthenticated access is 60 requests an hour
        # against an address a runner shares, so with no credential those four never run and this
        # step still reports OK. The token raises it to 5,000 and needs no permission beyond the
        # read-only `contents` already granted above.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make test

  markdown-lint:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !node_modules
