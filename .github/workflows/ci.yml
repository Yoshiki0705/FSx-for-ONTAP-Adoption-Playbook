name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: docs quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pipx install ruff

      # check and format are separate steps because formatting drift otherwise passes locally
      # and only surfaces in CI, which is exactly the failure this ordering prevents.
      - name: Lint Python tooling
        run: ruff check tools scripts

      - name: Check Python formatting
        run: ruff format --check tools scripts

      # Each validator runs as its own step so a failure names the concern that broke,
      # rather than reporting "make all failed".
      - name: Validate frontmatter
        run: python3 tools/validate_frontmatter.py --stats

      - name: Check i18n parity
        run: python3 tools/check_i18n_parity.py

      - name: Audit public output
        run: python3 tools/audit_public_output.py

      - name: Check internal links
        run: python3 tools/check_links.py

  markdown-lint:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: |
            **/*.md
            !node_modules
