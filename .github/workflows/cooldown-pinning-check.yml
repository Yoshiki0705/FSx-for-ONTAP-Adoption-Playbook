# Reusable workflow: check the Renovate configuration and the dependency pins of a repository.
#
# Called by the Spokes (not by this repository). Runs two subcommands of the check that lives in the
# source repository (scripts/check_supply_chain.py): `renovate` (cooldown, automerge, the preset
# reference) and `pinning` (exact pins for production dependencies, Actions and tools). The check is
# not copied here: it reads the Policy_File and the presets from fixed paths under --root and imports
# the pure core by a path relative to `scripts/`. It is checked out at `policy-ref`, a full commit SHA
# the caller pins, and run against a scratch directory (`work`) holding the caller's tree with the
# Policy_File from that commit laid on top.
#
# `pinned-sha-exist`, which asks GitHub whether a pinned SHA exists, needs the network and is not run
# here.
#
# Fails the calling job when either subcommand reports a violation or cannot run. Both subcommands
# always run, so one failure does not hide the other. Violations are written to the job summary.
#
# No secrets, no write permission, no inherited secrets.
name: cooldown-pinning-check

on:
  workflow_call:
    inputs:
      policy-ref:
        description: 40-digit commit SHA of the source repository that holds the check and the Policy_File
        type: string
        required: true
      renovate-config-path:
        description: Renovate configuration of the calling repository, relative to its root
        type: string
        required: false
        default: renovate.json

permissions: {}

env:
  # PyYAML is imported when the tool starts (one of its subcommands needs it), not only by these two.
  PYYAML_VERSION: "6.0.3"

jobs:
  check:
    name: check cooldown and pinning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check inputs
        env:
          POLICY_REF: ${{ inputs.policy-ref }}
          RENOVATE_CONFIG_PATH: ${{ inputs.renovate-config-path }}
        run: |
          if ! [[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::policy-ref must be 40 lowercase hexadecimal digits"
            exit 1
          fi
          case "$RENOVATE_CONFIG_PATH" in
            ''|/*|..|../*|*/..|*/../*)
              echo "::error::renovate-config-path must be a relative path without '..'"
              exit 1
              ;;
          esac

      - name: Checkout the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false

      - name: Checkout the check at policy-ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Yoshiki0705/FSx-for-ONTAP-Cyber-Resilience-Patterns
          ref: ${{ inputs.policy-ref }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==${PYYAML_VERSION}"

      - name: Prepare the scratch tree
        env:
          RENOVATE_CONFIG_PATH: ${{ inputs.renovate-config-path }}
        run: |
          mkdir -p work/docs/agent
          (cd caller && tar --exclude=./.git -cf - .) | tar -xf - -C work
          cp source/docs/agent/supply-chain-policy.json work/docs/agent/supply-chain-policy.json
          if [ -f source/docs/agent/automerge-required-checks.json ]; then
            cp source/docs/agent/automerge-required-checks.json work/docs/agent/automerge-required-checks.json
          fi
          if [ "$RENOVATE_CONFIG_PATH" != "renovate.json" ] && [ -f "caller/$RENOVATE_CONFIG_PATH" ]; then
            cp "caller/$RENOVATE_CONFIG_PATH" work/renovate.json
          fi

      - name: Check the Renovate configuration
        run: |
          if python3 source/scripts/check_supply_chain.py renovate --root work > "$RUNNER_TEMP/renovate.out" 2> "$RUNNER_TEMP/renovate.err"; then
            status=0
          else
            status=$?
          fi
          {
            echo "### cooldown-pinning-check: renovate"
            echo
            echo "Exit status: $status"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/renovate.out"
            cat "$RUNNER_TEMP/renovate.err"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/renovate.out"
          cat "$RUNNER_TEMP/renovate.err" >&2
          if [ "$status" -ne 0 ]; then
            echo "::error::renovate check failed with exit status $status"
            exit "$status"
          fi

      # Runs even when the step above failed, so one failure does not hide the other.
      - name: Check dependency pinning
        if: ${{ !cancelled() }}
        run: |
          if python3 source/scripts/check_supply_chain.py pinning --root work > "$RUNNER_TEMP/pinning.out" 2> "$RUNNER_TEMP/pinning.err"; then
            status=0
          else
            status=$?
          fi
          {
            echo "### cooldown-pinning-check: pinning"
            echo
            echo "Exit status: $status"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/pinning.out"
            cat "$RUNNER_TEMP/pinning.err"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/pinning.out"
          cat "$RUNNER_TEMP/pinning.err" >&2
          if [ "$status" -ne 0 ]; then
            echo "::error::pinning check failed with exit status $status"
            exit "$status"
          fi
