name: Accuracy correction
description: Report an inaccurate, stale, or unsupported claim in existing content
title: "[Accuracy correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for accuracy problems in existing content. Use the translation request form
        for a meaning or wording problem limited to a translation.

        Do not include private case data, organization or personal names, real identifiers,
        private addresses or hostnames, support correspondence, or internal references.

  - type: input
    id: file
    attributes:
      label: File and line
      description: Identify the existing claim that needs correction.
      placeholder: docs/ja/domains/performance/notes/example.md:42
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Accuracy problem
      options:
        - Factually incorrect
        - Stale
        - Evidence tier overstates the support
        - Measurement conditions are missing
        - Claim is broader than its source or observation
        - Other accuracy problem
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current claim and problem
      description: Quote only the minimum text needed and explain why it is inaccurate.
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: State the corrected claim and its limits.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Primary source or reproducible evidence
      description: >-
        Link the primary source, or provide the environment, date, procedure, and observed result.
        State any conditions where the correction does not apply.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I removed private case data and identifying or internal information.
          required: true
