name: Correction
description: Report something in this repository that is wrong, stale, or misleading
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Corrections are as valuable as new content. If a note's `evidence` tier overstates its
        support, that is worth reporting even when the underlying claim turns out to be right.

        **Translation reports are equally welcome.** Everything outside Japanese and English is
        machine-assisted and has not been reviewed by a native speaker before publication, so
        awkward phrasing and mistranslated terms are expected to reach you before they reach us.
        You do not need to propose a replacement — pointing at the sentence is enough.

  - type: input
    id: file
    attributes:
      label: File and line
      placeholder: docs/ja/domains/performance/notes/example.md:42
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: The language of the file you are reporting. Leave as-is if it does not apply.
      options:
        - Not language-specific
        - ja
        - en
        - ko
        - zh-CN
        - zh-TW
        - fr
        - de
        - es
    validations:
      required: false

  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Factually incorrect
        - Stale (was correct, no longer is)
        - Evidence tier overstates the support
        - Number published without its measurement environment
        - Vendor-versus framing or unbalanced trade-offs
        - Broken link or navigation dead end
        - Translation diverges from the Japanese source
        - Other
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: What is wrong, and what it should say
    validations:
      required: true

  - type: textarea
    id: basis
    attributes:
      label: Basis
      description: >
        Documentation URL, or your own measurement with ONTAP version, region, and configuration.
        If you have not verified it yourself, say so - a hypothesis is still worth filing.
    validations:
      required: false
