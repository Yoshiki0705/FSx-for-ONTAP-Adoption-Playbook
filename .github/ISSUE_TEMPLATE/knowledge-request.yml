name: New note proposal
description: Propose one unanswered technical question for a new note
title: "[New note] "
labels: ["knowledge-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the repository does not answer a technical question. Use the accuracy
        correction form for an existing claim and the translation request form for translated text.

        Do not include private case data, organization or personal names, real identifiers,
        private addresses or hostnames, support correspondence, or internal references.

  - type: textarea
    id: question
    attributes:
      label: Question the note should answer
      description: State one question rather than a topic label.
      placeholder: How should clients validate failover behavior before production use?
    validations:
      required: true

  - type: dropdown
    id: lifecycle
    attributes:
      label: Lifecycle phase
      multiple: true
      options:
        - assess
        - design
        - migrate
        - build
        - operate
        - optimize
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Topic domain
      multiple: true
      options:
        - block-storage
        - client-access
        - data-protection
        - data-utilization
        - security-governance
        - performance
        - cost
        - multiprotocol-identity
        - observability
    validations:
      required: true

  - type: textarea
    id: reader
    attributes:
      label: Reader and decision
      description: Describe who needs the answer and which decision or action it supports.
    validations:
      required: true

  - type: textarea
    id: searched
    attributes:
      label: Existing material checked
      description: Link the repository pages you checked so the proposal does not duplicate them.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Primary sources or reproducible context
      description: >-
        Link applicable primary sources. For a proposed reproduction, state the environment,
        procedure, and expected comparison without including identifying details.
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I removed private case data and identifying or internal information.
          required: true
