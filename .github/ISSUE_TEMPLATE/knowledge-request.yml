name: Knowledge request
description: Request a note on a topic that is missing or unclear
title: "[Knowledge] "
labels: ["knowledge-request"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include company names, real identifiers, IP addresses, account IDs, or support case
        numbers. Describe your situation by industry and scale band instead.

  - type: textarea
    id: question
    attributes:
      label: The question you need answered
      description: State it as a question, not a topic label.
      placeholder: Why does throughput drop when NFS and SMB clients access the same volume concurrently?
    validations:
      required: true

  - type: dropdown
    id: lifecycle
    attributes:
      label: Lifecycle phase
      multiple: true
      options:
        - assess
        - design
        - migrate
        - build
        - operate
        - optimize
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Topic domain
      multiple: true
      options:
        - block-storage
        - client-access
        - data-protection
        - data-utilization
        - security-governance
        - performance
        - cost
        - multiprotocol-identity
        - observability
    validations:
      required: true

  - type: dropdown
    id: endpoint
    attributes:
      label: Endpoint you are connecting from
      description: >-
        Only for client-access requests. The module records how far it goes per endpoint, so
        naming yours is what moves a row off "accepting requests".
      multiple: true
      options:
        - Windows endpoint
        - Linux inside WSL2
        - Mac endpoint
        - Native Linux endpoint
        - Amazon WorkSpaces / AppStream 2.0
        - Chromebook / iPad / Android (browser only)
        - Thin client (VDI-only device)
        - On-premises Windows Server
        - EC2 instance (not an endpoint - see the block-storage module)
        - Other / not listed
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Industry, scale band, and protocols in use. No identifying details.
      placeholder: |
        Industry: manufacturing
        Scale: several hundred TB
        Protocols: SMB primary, NFS for a build pipeline
    validations:
      required: false

  - type: textarea
    id: searched
    attributes:
      label: What you already checked
      description: Which existing notes or documents you looked at, so the answer does not duplicate them.
    validations:
      required: false
