<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
:root { --ink: #1f2933; --surface: #ffffff; --accent: #0b5cad; }
body { margin: 0; color: var(--ink); background: var(--surface); line-height: 1.8; font-weight: 400; }
h1 { font-size: 24px; font-weight: 700; margin: 0 0 16px; }
.card { padding: 16px; border: 1px solid #d5dae0; border-radius: 8px; transition: background-color 120ms ease-out; }
input { font-size: 16px; }
</style>
</head>
<body>
<h1>相談の履歴</h1>
<div class="card">前月比 +12%</div>
</body>
</html>
